  <g stroke="#ed1c24" stroke-width="3" stroke-opacity="0.22" filter="url(#f-line-glow)"><line x1="-2%" y1="22%" x2="13%" y2="10%"/><line x1="13%" y1="10%" x2="23%" y2="0%"/><line x1="13%" y1="10%" x2="22%" y2="23%"/><line x1="22%" y1="23%" x2="28%" y2="33%"/><line x1="22%" y1="23%" x2="9%" y2="37%"/><line x1="-2%" y1="50%" x2="15%" y2="68%"/><line x1="15%" y1="68%" x2="18%" y2="74%"/><line x1="18%" y1="74%" x2="34%" y2="95%"/><line x1="34%" y1="95%" x2="40%" y2="102%"/><line x1="15%" y1="68%" x2="4%" y2="78%"/><line x1="18%" y1="74%" x2="8%" y2="98%"/><line x1="28%" y1="-2%" x2="22%" y2="23%"/><line x1="68%" y1="-2%" x2="73%" y2="8%"/><line x1="73%" y1="8%" x2="85%" y2="25%"/><line x1="85%" y1="25%" x2="102%" y2="15%"/><line x1="73%" y1="8%" x2="80%" y2="-2%"/><line x1="85%" y1="25%" x2="94%" y2="35%"/><line x1="94%" y1="35%" x2="102%" y2="40%"/><line x1="102%" y1="62%" x2="90%" y2="70%"/><line x1="90%" y1="70%" x2="82%" y2="85%"/><line x1="82%" y1="85%" x2="76%" y2="102%"/><line x1="82%" y1="85%" x2="94%" y2="84%"/><line x1="94%" y1="84%" x2="102%" y2="80%"/><line x1="90%" y1="70%" x2="78%" y2="60%"/></g>
  <g stroke="#ed1c24" stroke-width="1" stroke-opacity="0.45"><line x1="-2%" y1="22%" x2="13%" y2="10%"/><line x1="13%" y1="10%" x2="23%" y2="0%"/><line x1="13%" y1="10%" x2="22%" y2="23%"/><line x1="22%" y1="23%" x2="28%" y2="33%"/><line x1="22%" y1="23%" x2="9%" y2="37%"/><line x1="-2%" y1="50%" x2="15%" y2="68%"/><line x1="15%" y1="68%" x2="18%" y2="74%"/><line x1="18%" y1="74%" x2="34%" y2="95%"/><line x1="34%" y1="95%" x2="40%" y2="102%"/><line x1="15%" y1="68%" x2="4%" y2="78%"/><line x1="18%" y1="74%" x2="8%" y2="98%"/><line x1="28%" y1="-2%" x2="22%" y2="23%"/><line x1="68%" y1="-2%" x2="73%" y2="8%"/><line x1="73%" y1="8%" x2="85%" y2="25%"/><line x1="85%" y1="25%" x2="102%" y2="15%"/><line x1="73%" y1="8%" x2="80%" y2="-2%"/><line x1="85%" y1="25%" x2="94%" y2="35%"/><line x1="94%" y1="35%" x2="102%" y2="40%"/><line x1="102%" y1="62%" x2="90%" y2="70%"/><line x1="90%" y1="70%" x2="82%" y2="85%"/><line x1="82%" y1="85%" x2="76%" y2="102%"/><line x1="82%" y1="85%" x2="94%" y2="84%"/><line x1="94%" y1="84%" x2="102%" y2="80%"/><line x1="90%" y1="70%" x2="78%" y2="60%"/></g>
