  <circle cx="27%" cy="30%" r="9" fill="url(#g-bokeh)"/>
  <circle cx="20%" cy="53%" r="34" fill="url(#g-bokeh)"/>
  <circle cx="35%" cy="82%" r="30" fill="url(#g-bokeh)"/>
